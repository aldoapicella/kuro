name: Core, transport and AI
on:
  push:
    paths: ['packages/contracts/**', 'packages/core/**', 'packages/transport/**', 'packages/ai/**', 'apps/desktop/**', 'tests/integration/**', 'harnesses/**', 'fixtures/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', '.github/workflows/core-transport.yml']
  pull_request:
    paths: ['packages/contracts/**', 'packages/core/**', 'packages/transport/**', 'packages/ai/**', 'apps/desktop/**', 'tests/integration/**', 'harnesses/**', 'fixtures/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', '.github/workflows/core-transport.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install Linux native runtime prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - name: Install macOS native runtime prerequisite
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @kuro/ai-harness harness
      - run: pnpm --filter @kuro/ai probe:runtime
      - run: pnpm probe:host
      - run: pnpm test:reference
      - run: pnpm --filter @kuro/transport-harness smoke
      - run: pnpm --filter @kuro/transport-harness core-smoke
      - run: pnpm desktop:build
      - run: pnpm --filter @kuro/desktop package
      - name: Configure Linux Chromium sandbox helpers
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @kuro/desktop exec install-electron
          desktop_sandbox="$(pnpm --filter @kuro/desktop exec node -p "require('path').join(require('path').dirname(require('electron')), 'chrome-sandbox')")"
          packaged_sandbox="build/packages/KURO-linux-$(node -p process.arch)/chrome-sandbox"
          sudo chown root:root "$desktop_sandbox" "$packaged_sandbox"
          sudo chmod 4755 "$desktop_sandbox" "$packaged_sandbox"
      - name: Verify packaging preserves workspace contracts and dependency manifests
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml packages/*/package.json apps/desktop/package.json
      - name: Electron UI regression tests
        if: runner.os == 'macOS'
        run: |
          node apps/desktop/scripts/probe-package.mjs
          pnpm exec playwright test --config=apps/desktop/playwright.config.ts
      - name: Electron UI regression tests with a virtual display
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum node apps/desktop/scripts/probe-package.mjs
          xvfb-run --auto-servernum pnpm exec playwright test --config=apps/desktop/playwright.config.ts
