name: Core, transport and AI
on:
  push:
    paths: ['packages/contracts/**', 'packages/core/**', 'packages/transport/**', 'packages/ai/**', 'harnesses/**', 'fixtures/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', '.github/workflows/core-transport.yml']
  pull_request:
    paths: ['packages/contracts/**', 'packages/core/**', 'packages/transport/**', 'packages/ai/**', 'harnesses/**', 'fixtures/contracts/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.json', '.github/workflows/core-transport.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install Linux native runtime prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @kuro/ai-harness harness
      - run: pnpm --filter @kuro/ai probe:runtime
      - run: pnpm probe:host
      - run: pnpm test:reference
      - run: pnpm --filter @kuro/transport-harness smoke
      - run: pnpm --filter @kuro/transport-harness core-smoke
