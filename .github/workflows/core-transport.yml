name: Core, transport, AI, and desktop
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install Linux native runtime prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libatomic1
      - name: Install macOS native runtime prerequisite
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        run: |
          pnpm typecheck
          pnpm build
      - name: Full contracts, core, transport, AI, and desktop suites
        run: pnpm test
      - name: QVAC worker heartbeat
        run: pnpm --filter @kuro/ai probe:runtime
      - name: Host SQLite capability probe
        run: pnpm probe:host
      - name: Reference and transport harnesses
        run: |
          pnpm test:reference
          pnpm --filter @kuro/transport-harness smoke
          pnpm --filter @kuro/transport-harness core-smoke
      - name: Verify macOS native packaging and trusted-runner guards
        if: runner.os == 'macOS'
        run: node --test apps/desktop/test/macos-native-deps.test.mjs scripts/release-runner-guard.test.mjs
      - name: Verify release metadata and qualification gates
        run: |
          node --test scripts/release-validate.test.mjs
          node --check scripts/qualify-release.mjs
          node --check scripts/offline-gui.mjs
          node --check apps/desktop/ui/remote-driver.mjs
          for script in scripts/offline-*.sh; do sh -n "$script"; done
      - name: Build and package without source manifest mutation
        run: node scripts/check-source-packaging.mjs pnpm desktop:package
      - name: Configure Linux Chromium sandbox helpers
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @kuro/desktop exec install-electron
          desktop_sandbox="$(pnpm --filter @kuro/desktop exec node -p "require('path').join(require('path').dirname(require('electron')), 'chrome-sandbox')")"
          packaged_sandbox="build/packages/KURO-linux-$(node -p process.arch)/chrome-sandbox"
          sudo chown root:root "$desktop_sandbox" "$packaged_sandbox"
          sudo chmod 4755 "$desktop_sandbox" "$packaged_sandbox"
      - name: Relocated Linux package probe
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node apps/desktop/scripts/probe-package.mjs --probe=host
      - name: Relocated macOS package probes
        if: runner.os == 'macOS'
        run: |
          node apps/desktop/scripts/probe-package.mjs --probe=host
          node apps/desktop/scripts/probe-package.mjs --probe=runtime
          if [ "$(uname -m)" = "arm64" ] && [ "$(uname -r)" = "25.5.0" ] && [ "$(sw_vers -buildVersion)" = "25F71" ]; then
            node apps/desktop/scripts/probe-package.mjs --probe=lifecycle
          else
            echo 'Native addon built; this hosted OS is not qualified for protected real mode. Exact-platform lifecycle and actual-model gates run in trusted release validation.'
          fi
          pnpm exec playwright test --config=apps/desktop/playwright.config.ts
      - name: Electron UI regression tests with a virtual display
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum pnpm exec playwright test --config=apps/desktop/playwright.config.ts
      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: desktop-diagnostics-${{ runner.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/desktop-ui-results
            build/packages/*.sha256
            build/packages/*/resources/app/package.json
